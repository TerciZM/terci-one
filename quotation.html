<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All quotes · Terci One</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">T</div>
          <div><strong>Terci One</strong><small>Business platform</small></div>
        </div>
        <nav>
          <a href="index.html">Dashboard</a
          ><a class="active quote-nav" href="quotation.html"
            >Quotations <span>＋</span></a
          ><a href="#customers">Customers</a
          ><a href="#items">Items & inventory</a
          ><a href="#purchasing">Purchasing</a><a href="#reports">Reports</a>
        </nav>
        <div class="sidebar-footer">Terci Communications Limited</div>
      </aside>
      <main class="main">
        <header class="topbar quote-list-topbar">
          <div>
            <span class="eyebrow">SALES</span>
            <h1>All Quotes <span class="title-chevron">⌄</span></h1>
          </div>
          <a class="primary button-link" href="new-quotation.html">＋ New</a>
        </header>
        <section class="content quote-list-content">
          <section class="panel quote-list-panel">
            <div class="quote-list-toolbar">
              <span class="toolbar-filter">☷</span
              ><input
                id="quote-filter"
                placeholder="Search quotes, customers or reference"
              />
            </div>
            <div class="table-wrap">
              <table class="quote-list-table">
                <thead>
                  <tr>
                    <th></th>
                    <th>Date</th>
                    <th>Quote number</th>
                    <th>Reference number</th>
                    <th>Customer name</th>
                    <th>Status</th>
                    <th>Amount</th>
                  </tr>
                </thead>
                <tbody id="quote-list">
                  <tr>
                    <td colspan="7" class="empty">Loading quotations…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
    <script>
      const list = document.getElementById("quote-list"),
        filter = document.getElementById("quote-filter");
      let quotes = [];
      const qmoney = (n) =>
        "K" +
        Number(n || 0).toLocaleString("en-ZM", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      function drawQuotes() {
        const term = (filter.value || "").toLowerCase();
        const shown = quotes.filter((q) =>
          [q.quote_number, q.customer_name, q.reference_number, q.status].some(
            (v) =>
              String(v || "")
                .toLowerCase()
                .includes(term),
          ),
        );
        list.innerHTML = shown.length
          ? shown
              .map(
                (q) =>
                  `<tr><td><input type="checkbox"></td><td>${q.quote_date || "—"}</td><td><a href="new-quotation.html">${q.quote_number || "—"}</a></td><td>${q.reference_number || "—"}</td><td>${q.customer_name || "—"}</td><td><span class="quote-status ${String(q.status || "DRAFT").toLowerCase()}">${q.status || "DRAFT"}</span></td><td>${qmoney(q.total)}</td></tr>`,
              )
              .join("")
          : '<tr><td colspan="7" class="empty">No quotations found.</td></tr>';
      }
      fetch("/api/quotations")
        .then((r) => r.json())
        .then((a) => {
          quotes = Array.isArray(a) ? a : [];
          drawQuotes();
        })
        .catch(() => {
          list.innerHTML =
            '<tr><td colspan="7" class="empty">Unable to load quotations.</td></tr>';
        });
      filter.addEventListener("input", drawQuotes);
    </script>
  </body>
</html>
